<!DOCTYPE html>
<html>
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00e5ff">
  <title>ARISE FITNESS</title>
  <meta name="viewport" content="width=device-width, initial-scale=0.80, maximum-scale=1.5">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      overflow-x: hidden;
      width: 100%;
      background: #05070a;
    }

    /* 3D energy orb canvas — sits behind the hero content */
    #hero3d {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
      pointer-events: none; /* lets clicks pass through to page below */
    }

    .hero {
      position: relative;
      z-index: 2;
    }

    /* Soft dark gradient so text stays readable over the 3D scene */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(5,7,10,0) 0%, rgba(5,7,10,0.85) 75%);
      z-index: -1;
    }

    .hero h1 {
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.6), 0 0 60px rgba(0, 229, 255, 0.25);
    }

    @media(max-width:600px){
      nav{padding:10px 12px !important;}
      nav .logo{font-size:16px !important; letter-spacing:2px !important;}
      nav div a{font-size:11px !important; margin-left:8px !important;}
      .hero{padding:50px 15px 10px !important;}
      .hero h1{font-size:36px !important; letter-spacing:3px !important;}
      #indexLevelBox{padding:10px 14px !important; gap:8px !important; flex-wrap:wrap; justify-content:center;}
    }

    #music-btn {
      position:fixed; bottom:20px; right:20px; z-index:99999;
      background:rgba(0,229,255,0.15); border:1px solid #00e5ff;
      color:#00e5ff; padding:10px 16px; border-radius:30px;
      font-size:12px; letter-spacing:2px; cursor:pointer;
      backdrop-filter:blur(10px); font-family: sans-serif;
      box-shadow: 0 0 20px rgba(0,229,255,0.25);
      transition: transform 0.2s ease;
    }
    #music-btn:active { transform: scale(0.95); }

    /* Premium glass panel for the level badge */
    #indexLevelBox{
      margin:28px auto 0; display:inline-flex; gap:14px; align-items:center;
      background:rgba(0,229,255,0.08); border:1px solid rgba(0,229,255,0.35);
      padding:12px 22px; border-radius:40px; backdrop-filter:blur(12px);
      box-shadow:0 0 25px rgba(0,229,255,0.15), inset 0 0 20px rgba(0,229,255,0.05);
    }

    /* Premium button glow */
    .hero .btn {
      position: relative;
      box-shadow: 0 0 20px rgba(0,229,255,0.35);
      transition: box-shadow 0.3s ease, transform 0.2s ease;
    }
    .hero .btn:active {
      box-shadow: 0 0 35px rgba(0,229,255,0.6);
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="dark-aria.mp3" loop preload="auto"></audio>
  <div id="music-btn">🔊 TAP TO ARISE</div>

<nav>
  <div class="logo">ARISE FITNESS</div>
  <div>
    <a href="index.html">Home</a>
    <a href="workout.html">Workout</a>
    <a href="stats.html">Stats</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div class="hero">
  <canvas id="hero3d"></canvas>

  <h1>ARISE FITNESS</h1>
  <p>DISCIPLINE // POWER // ARISE</p>

  <!-- LEVEL BADGE -->
  <div id="indexLevelBox">
    <span style="color:#00e5ff; font-size:11px; letter-spacing:3px; font-weight:900;" id="indexRank">E-RANK</span>
    <span style="color:#fff; font-weight:900; letter-spacing:2px; font-size:14px;" id="indexLvl">Lv 0</span>
    <span style="color:#7aa; font-size:11px; letter-spacing:1px;" id="indexXp">0 XP</span>
    <span style="color:#00ff88; font-size:10px; letter-spacing:2px; margin-left:4px;">● ARISEN</span>
  </div>
  <br><br>
  <a href="workout.html" class="btn">START TRAINING</a>
</div>

<!-- Three.js — CDN, no build step needed -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ============ 3D ENERGY ORB — "SHADOW MONARCH" HERO ============
(function initHero3D() {
  const canvas = document.getElementById('hero3d');
  const heroEl = document.querySelector('.hero');

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / heroEl.offsetHeight, 0.1, 1000);
  camera.position.z = 6;

  function resize() {
    const w = window.innerWidth;
    const h = heroEl.offsetHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // Core orb — dark wireframe sphere, like a contained void of power
  const coreGeo = new THREE.IcosahedronGeometry(1.6, 2);
  const coreMat = new THREE.MeshBasicMaterial({
    color: 0x00e5ff,
    wireframe: true,
    transparent: true,
    opacity: 0.35
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);

  // Inner glow sphere
  const glowGeo = new THREE.IcosahedronGeometry(1.3, 1);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x00e5ff,
    transparent: true,
    opacity: 0.06
  });
  scene.add(new THREE.Mesh(glowGeo, glowMat));

  // Particle field — floating XP-like motes around the orb
  const particleCount = 260;
  const positions = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    const radius = 2.2 + Math.random() * 2.8;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    positions[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);
  }
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particleMat = new THREE.PointsMaterial({
    color: 0x00e5ff,
    size: 0.03,
    transparent: true,
    opacity: 0.7
  });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  // Subtle drift toward pointer — feels alive without being distracting
  let targetX = 0, targetY = 0;
  window.addEventListener('pointermove', (e) => {
    targetX = (e.clientX / window.innerWidth - 0.5) * 0.6;
    targetY = (e.clientY / window.innerHeight - 0.5) * 0.6;
  });

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animate() {
    requestAnimationFrame(animate);
    if (!reduceMotion) {
      core.rotation.y += 0.0022;
      core.rotation.x += 0.0009;
      particles.rotation.y -= 0.0009;
      camera.position.x += (targetX - camera.position.x) * 0.02;
      camera.position.y += (-targetY - camera.position.y) * 0.02;
      camera.lookAt(0, 0, 0);
    }
    renderer.render(scene, camera);
  }
  animate();
})();

// ============ MUSIC ============
const bgMusic = document.getElementById('bg-music');
const musicBtn = document.getElementById('music-btn');
bgMusic.volume = 0.25;
let savedTime = localStorage.getItem('aria-time');
if(savedTime) bgMusic.currentTime = parseFloat(savedTime);
let wasPlaying = localStorage.getItem('aria-playing') === 'true';

function playMusic(){
  bgMusic.play().then(()=>{
    musicBtn.innerHTML="🔊 DARK ARIA Lv2";
    localStorage.setItem('aria-playing','true');
  }).catch(()=>{});
}
setInterval(()=>{ if(!bgMusic.paused) localStorage.setItem('aria-time', bgMusic.currentTime); }, 800);
if(wasPlaying) playMusic();

document.addEventListener('click', function firstClick(){
  playMusic();
  document.removeEventListener('click', firstClick);
}, {once:true});

musicBtn.onclick = (e)=>{
  e.stopPropagation();
  if(bgMusic.paused){ bgMusic.play(); musicBtn.innerHTML="🔊 DARK ARIA Lv2"; localStorage.setItem('aria-playing','true'); }
  else { bgMusic.pause(); musicBtn.innerHTML="🔇 PAUSED"; localStorage.setItem('aria-playing','false'); }
};
playMusic();

// ============ LEVEL SYSTEM ============
function getRank(lvl){
  if(lvl<=10) return "E-RANK";
  if(lvl<=25) return "D-RANK";
  if(lvl<=45) return "C-RANK";
  if(lvl<=70) return "B-RANK";
  if(lvl<=100) return "A-RANK";
  if(lvl<=130) return "S-RANK";
  if(lvl<=154) return "MONARCH";
  return "SHADOW MONARCH";
}
let xp = localStorage.getItem('ARISE_TOTAL_XP')||'0';
let lvl = localStorage.getItem('ARISE_LEVEL')||'0';
document.getElementById('indexLvl').innerText = "Lv " + lvl;
document.getElementById('indexXp').innerText = xp + " XP";
document.getElementById('indexRank').innerText = getRank(parseInt(lvl));
</script>

</body>
</html>
