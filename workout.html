.workout-container{max-width:900px;margin:40px auto;padding:0 20px; display:grid; gap:22px;}
.workout-card{ background: linear-gradient(145deg, rgba(10,20,30,0.9), rgba(5,7,10,0.8)); border: 1px solid rgba(0,229,255,0.3); backdrop-filter: blur(15px); padding: 35px 30px; border-radius: 16px; cursor: pointer; transition: all 0.4s ease; position: relative; overflow: hidden; }
.workout-card::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,229,255,0.2),transparent);transition:0.6s;}

.workout-card:hover{border-color:#00e5ff;box-shadow:0 0 40px rgba(0,229,255,0.5);transform:translateY(-8px);}
.workout-card h3{color:#00e5ff;margin:0 0 10px 0;letter-spacing:2px;font-size:22px;font-weight:900;}
.workout-card p{color:#a0b8d0;margin:0;font-size:15px;}
.workout-card.ex-count{color:#00e5ff; font-size:11px; letter-spacing:3px; margin-top:10px; font-weight:800;}

.portal::after{content:"";position:absolute;inset:18%;background:radial-gradient(circle,#ffffff 0%,#c9f7ff 20%,#00d0ff 45%,#002a44 75%);border-radius:50%;box-shadow:0 0 100px #00e5ff,0 0 200px #00aaff,inset 0 0 60px #fff;animation:corePulse 0.4s ease-in-out infinite alternate;}
.portal-ring{position:absolute;border-radius:50%;border:4px solid rgba(0,229,255,0.9);box-shadow:0 0 40px #00e5ff,inset 0 0 40px #00e5ff;}
.portal-ring:nth-child(1){inset:8%;animation:swirlSpin 0.6s linear infinite reverse;}
.portal-ring:nth-child(2){inset:-3%;border-color:rgba(0,229,255,0.4);border-style:dashed;border-width:3px;animation:swirlSpin 1.2s linear infinite;}

@keyframes corePulse{from{transform:scale(0.9);}to{transform:scale(1.1);}}
@keyframes openGate{0%{transform:scale(0);opacity:0;filter:blur(50px);}20%{opacity:1;filter:blur(0);}50%{transform:scale(1.1);opacity:1;}80%{transform:scale(1.1);opacity:1;}100%{transform:scale(1.5);opacity:0;filter:blur(40px);}}
@keyframes cardArise{0%{opacity:0;transform:scale(0.6) translateY(80px);filter:blur(20px);}100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0);}}

#close-portal:hover{background:rgba(0,229,255,0.2);transform:rotate(90deg);}
#detail-title{color:#fff;font-size:30px!important;font-weight:900;letter-spacing:2px;margin:0;text-shadow:0 0 20px #00e5ff;}

.day-tab{background:rgba(10,20,30,0.8);border:1px solid rgba(0,229,255,0.25);color:#8ab;padding:10px 18px;border-radius:30px;cursor:pointer;letter-spacing:2px;font-size:12px;font-weight:800;transition:0.3s;}

.builder-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;}

.lib-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;}

.search{background:rgba(0,0,0,0.5);border:1px solid rgba(0,229,255,0.2);color:#fff;padding:8px 12px;border-radius:20px;outline:none;font-size:12px;width:180px;}

@keyframes slideLeft{from{transform:translateX(0); opacity:1} to{transform:translateX(-100%); opacity:0}}

.q-name{color:#fff; font-size:26px; font-weight:900; margin:10px 0 6px; line-height:1.2}

function calcXP(ex){
  let diff = DIFF[ex.name]||5;
  let sets = ex.sets||1;
  let diffFactor;
  if(diff <= 20){ diffFactor = diff / 5; }
  else { diffFactor = 4 + (diff - 20) / 25; }
  if(METER_ONLY.includes(ex.name)){
    let meters = ex.meters||ex.reps||100;
    return Math.floor(sets * (meters * 0.18 * diffFactor * 0.3 + diff * 2.2));
  }
  if(SEC_ONLY.includes(ex.name)){
    let sec = ex.sec||ex.reps||60;
    let perSec = 0.35;
    if(ex.name==="Shadow Boxing") perSec = 0.75;
    if(ex.name==="Plank Hold") perSec = 0.25;
    if(ex.name==="Hollow Body Hold") perSec = 0.30;
    return Math.floor(sets * (sec * perSec * diffFactor * 0.5 + diff * 2.2));
  }
  let r = ex.reps||12;
  return Math.floor(sets * (diff * 2.5 + r * (1.0 + diffFactor*0.25)));
}
function getXPForLevel(lvl){
  if(lvl<=1) return 1000;
  return Math.floor(900*lvl + Math.pow(lvl, 1.5)*150);
}

  document.getElementById('qMeta').innerText = getQuestMeta(ex);
  document.getElementById('timerLabel').innerText = 'PERFORMING';
  document.getElementById('completeBtn').innerText = `COMPLETE SET ${curSetNum} ✓`;
  document.getElementById('completeBtn').style.display='block'; document.getElementById('completeBtn').onclick = completeSet;
  document.getElementById('restCtrl').style.display='none'; document.getElementById('skipBtn').style.display='none';
  let progress = ((curExIdx + (curSetNum-1)/ex.sets) / activeList.length)*100;
  document.getElementById('progressFill').style.width = progress+'%'; startWorkoutTimer();
}
function startWorkoutTimer(){ workoutSec=0; clearInterval(timerInt); document.getElementById('mainTimer').innerText='00:00'; timerInt=setInterval(()=>{ workoutSec++; document.getElementById('mainTimer').innerText = formatTime(workoutSec); },1000); }
function completeSet(){ clearInterval(timerInt); let ex = activeList[curExIdx]; if(curSetNum < ex.sets){ startRestPhase(false); } else { if(curExIdx < activeList.length - 1){ startRestPhase(true); } else { finishBattle(); } } }
function startRestPhase(isNextEx){
  inRestPhase = true; restLeft = restDefault;
  document.getElementById('timerLabel').innerText = isNextEx? 'REST • NEXT QUEST COMING' : 'REST - RECOVERING MANA';
  document.getElementById('completeBtn').style.display='none'; document.getElementById('restCtrl').style.display='flex'; document.getElementById('skipBtn').style.display='block';
  document.getElementById('mainTimer').innerText = formatTime(restLeft);
  timerInt=setInterval(()=>{
    restLeft--;
    document.getElementById('mainTimer').innerText = formatTime(restLeft);
    if(restLeft<=0){
      clearInterval(timerInt);
      try{ restBell.currentTime=0; restBell.play(); if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]); }catch(e){}
      if(isNextEx){ curExIdx++; curSetNum=1; } else { curSetNum++; }
      renderActiveQuest();
    }
  },1000);
}
function skipRest(){ clearInterval(timerInt); if(curExIdx >= activeList.length-1 && curSetNum >= activeList[curExIdx].sets){ finishBattle(); return; } let ex = activeList[curExIdx]; if(curSetNum < ex.sets){ curSetNum++; } else { curExIdx++; curSetNum=1; } renderActiveQuest(); }
function finishBattle(){
  clearInterval(timerInt);
  let totalXp = parseInt(localStorage.getItem('ARISE_TOTAL_XP')||'0') + totalBattleXP;
  let totalSets = parseInt(localStorage.getItem('ARISE_SETS')||'0') + activeList.reduce((s,x)=>s+x.sets,0);
  let battles = parseInt(localStorage.getItem('ARISE_BATTLES')||'0') + 1;
  localStorage.setItem('ARISE_TOTAL_XP', totalXp);
  localStorage.setItem('ARISE_SETS', totalSets);
  localStorage.setItem('ARISE_BATTLES', battles);
  let tempXp = totalXp; let calcLvl=0;
  while(calcLvl < 156){
    let need = getXPForLevel(calcLvl+1);
    if(tempXp >= need){ tempXp -= need; calcLvl++; } else break;
  }
  localStorage.setItem('ARISE_LEVEL', calcLvl);
  try {
    if(bgMusic) bgMusic.pause();
    ariseSfx.currentTime = 0; ariseSfx.volume = 1; ariseSfx.muted = false;
    let playPromise = ariseSfx.play();
    if(playPromise!== undefined){
      playPromise.then(()=>{ console.log("ARISE BAJA!"); }).catch(err=>{
        document.body.addEventListener('click', ()=>{ ariseSfx.play(); }, {once:true});
      });
    }
  } catch(e){ console.log(e); }
  closePortal();
  setTimeout(()=>{
    alert("BATTLE COMPLETE! +" + totalBattleXP + " XP\nNew Level: " + calcLvl);
    location.href="stats.html";
  }, 1500);
}
function setRestTime(s){ restDefault=s; restLeft=s; document.getElementById('mainTimer').innerText = formatTime(restLeft); document.querySelectorAll('.rest-ctrl button').forEach(b=>b.classList.remove('active')); document.getElementById('r'+s).classList.add('active'); }
function formatTime(s){ let m=String(Math.floor(s/60)).padStart(2,'0'); let sc=String(s%60).padStart(2,'0'); return `${m}:${sc}`; }
</script>
</body>
