<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout - Eclipse Monarch</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Tera purana design safe hai */
    body.portal-open.navbar, body.portal-open.workout-container { opacity: 0; pointer-events: none; filter: blur(15px); transition: 0.5s; }
    #portal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.8s;
    }
    #portal-overlay.active { opacity: 1; pointer-events: all; }
   .portal-content {
      width: 90%; max-width: 600px;
      background: rgba(10,20,30,0.9);
      border: 1px solid #00e5ff; border-radius: 20px;
      padding: 40px; box-shadow: 0 0 50px rgba(0,229,255,0.4);
      transform: scale(0.8); transition: transform 0.8s;
    }
    #portal-overlay.active.portal-content { transform: scale(1); }
   .portal { width: 100px; height: 100px; border: 3px solid #00e5ff; border-radius: 50%; margin: 0 auto 20px; box-shadow: 0 0 30px #00e5ff; animation: spin 2.5s linear; }
    @keyframes spin { from { transform: rotate(0deg) scale(0); } to { transform: rotate(720deg) scale(1); } }
    #detail-list { list-style: none; padding: 0; }
    #detail-list li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(0,229,255,0.1); }
    #music-btn {
      position:fixed; bottom:20px; right:20px; z-index:99999;
      background:rgba(0,229,255,0.15); border:1px solid #00e5ff;
      color:#00e5ff; padding:10px 16px; border-radius:30px;
      font-size:12px; letter-spacing:2px; cursor:pointer; backdrop-filter:blur(10px);
    }
  </style>
</head>
<body>

  <!-- MUSIC - SHURU SE REPEAT PE -->
  <audio id="bg-music" src="dark-aria.mp3" loop preload="auto"></audio>
  <div id="music-btn">🔊 TAP TO ARISE</div>

  <nav class="navbar">
    <div class="logo">ECLIPSE MONARCH</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="workout.html">Workout</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <!-- TERE 3 CARDS - SAME AS BEFORE -->
  <div class="workout-container" style="padding: 100px 20px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
    <div class="workout-card" style="border:1px solid #00e5ff; padding:30px; border-radius:15px; cursor:pointer; width:280px; text-align:center;">
      <h3>DAY 1 - CHEST & TRICEPS</h3>
    </div>
    <div class="workout-card" style="border:1px solid #00e5ff; padding:30px; border-radius:15px; cursor:pointer; width:280px; text-align:center;">
      <h3>DAY 2 - BACK & BICEPS</h3>
    </div>
    <div class="workout-card" style="border:1px solid #00e5ff; padding:30px; border-radius:15px; cursor:pointer; width:280px; text-align:center;">
      <h3>DAY 3 - LEGS & ABS</h3>
    </div>
  </div>

  <!-- PORTAL -->
  <div id="portal-overlay">
    <div class="portal-content">
      <div class="portal"></div>
      <h2 id="detail-title" style="color:#00e5ff; text-align:center; letter-spacing:2px;"></h2>
      <p id="detail-desc" style="text-align:center; opacity:0.7; margin:10px 0 20px;"></p>
      <ul id="detail-list"></ul>
      <button id="close-portal" style="margin-top:25px; width:100%; padding:12px; background:transparent; border:1px solid #00e5ff; color:#00e5ff; border-radius:10px; cursor:pointer; letter-spacing:2px;">CLOSE GATE</button>
    </div>
  </div>

<script>
// Workout Data - Same as before
const workouts = {
  "DAY 1 - CHEST & TRICEPS": { desc: "THE MONARCH'S POWER", list: ["Bench Press - 4x10", "Incline Dumbbell - 3x12", "Pushups - 100 Reps", "Tricep Dips - 3x15"] },
  "DAY 2 - BACK & BICEPS": { desc: "DOMINION OF SHADOWS", list: ["Pull-ups - 4x8", "Deadlifts - 4x8", "Barbell Rows - 3x12", "Bicep Curls - 3x12"] },
  "DAY 3 - LEGS & ABS": { desc: "FOUNDATION OF A KING", list: ["Squats - 5x8", "Lunges - 3x12", "Leg Press - 4x10", "Planks - 3x1min"] }
};

// Music System - Shuru se Repeat pe
const bgMusic = document.getElementById('bg-music');
const musicBtn = document.getElementById('music-btn');
bgMusic.volume = 0.25;

function playMusic() {
  bgMusic.play().then(() => {
    musicBtn.innerHTML = "🔊 DARK ARIA Lv2";
    setTimeout(() => { musicBtn.style.opacity = '0.4'; }, 3000);
  }).catch(()=>{});
}
document.addEventListener('click', function firstClick() {
  playMusic();
  document.removeEventListener('click', firstClick);
}, { once: true });
musicBtn.onclick = (e) => {
  e.stopPropagation();
  if(bgMusic.paused) { bgMusic.play(); musicBtn.innerHTML = "🔊 DARK ARIA Lv2"; }
  else { bgMusic.pause(); musicBtn.innerHTML = "🔇 PAUSED"; }
};
playMusic();

// Portal System
document.querySelectorAll('.workout-card').forEach(card => {
  card.addEventListener('click', () => {
    const title = card.querySelector('h3').innerText;
    document.getElementById('detail-title').innerText = title;
    document.getElementById('detail-desc').innerText = workouts[title].desc;
    document.getElementById('detail-list').innerHTML = workouts[title].list.map(i=>`<li><span>${i.split(' - ')[0]}</span><span style="color:#00e5ff;font-size:14px;">${i.split(' - ')[1]}</span></li>`).join('');
    const ov = document.getElementById('portal-overlay');
    ov.classList.remove('active'); void ov.offsetWidth; ov.classList.add('active');
    document.body.classList.add('portal-open');
    document.body.style.overflow = 'hidden';
    if(bgMusic.paused) playMusic();
  });
});
function closePortal() {
  document.getElementById('portal-overlay').classList.remove('active');
  document.body.classList.remove('portal-open');
  document.body.style.overflow = 'auto';
}
document.getElementById('close-portal').onclick = closePortal;
document.getElementById('portal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'portal-overlay') closePortal();
});
</script>

</body>
</html>
